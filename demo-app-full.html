<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رنموا للرب — التطبيق الكامل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0f2a1e', parchment: '#f7f4e9', cream: '#fdfbf7',
          gold: '#c8a84d', goldDeep: '#a8842e', sage: '#8a9a87',
          clay: '#c4a896', stone: '#6b635d',
        },
        fontFamily: { display: ['"Amiri"', 'serif'], arabic: ['"Noto Naskh Arabic"', 'serif'] },
      },
    },
  }
</script>

<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Naskh Arabic', serif; background: #fdfbf7; color: #0f2a1e; }
  ::selection { background: #c8a84d33; }
  .glass { background: rgba(255,255,255,0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.5); }
  .glass-dark { background: rgba(15,42,30,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
  .page-enter { animation: fadeUp 0.35s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body class="min-h-screen">

<!-- App Frame -->
<div id="app" class="max-w-md mx-auto bg-cream min-h-screen shadow-2xl shadow-ink/10 overflow-hidden relative">

  <!-- SCREEN: HOME -->
  <section id="screen-home" class="page-enter">
    <header class="relative h-[60vh] overflow-hidden">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1200&auto=format&fit=crop" class="w-full h-full object-cover" alt="cover">
      <div class="absolute inset-0 bg-gradient-to-t from-ink/90 via-ink/40 to-transparent"></div>
      <div class="absolute bottom-0 right-0 left-0 p-8 text-white">
        <h1 class="font-display text-5xl font-bold leading-[1.1] drop-shadow-lg">رنموا للرب</h1>
        <p class="text-white/80 text-lg mt-3">مكتبة روحية حديثة بأجمل الترانيم</p>
      </div>
    </header>

    <div class="-mt-10 relative z-10 px-6 pb-8">
      <!-- Book Covers -->
      <h2 class="font-display text-2xl font-bold text-ink mb-4">الكتب</h2>
      <div class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory">
        <a href="#" onclick="goLibrary('main'); return false;" class="snap-start shrink-0 w-32 rounded-2xl overflow-hidden shadow-xl shadow-ink/10 ring-1 ring-ink/5 hover:-translate-y-1 transition bg-ink">
          <div class="h-40 relative">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-70 mix-blend-overlay" alt="main">
            <div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid fa-book-bible text-4xl text-parchment drop-shadow-lg"></i></div>
          </div>
          <div class="p-3 bg-ink text-parchment">
            <h3 class="font-display font-bold text-sm">الكتاب الرئيسي</h3>
            <p class="text-[10px] text-parchment/60">1 — 1000+</p>
          </div>
        </a>
        <a href="#" onclick="goLibrary('taranim'); return false;" class="snap-start shrink-0 w-32 rounded-2xl overflow-hidden shadow-xl shadow-ink/10 ring-1 ring-ink/5 hover:-translate-y-1 transition bg-gradient-to-br from-goldDeep to-[#8a6a2a]">
          <div class="h-40 relative">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-40 mix-blend-overlay" alt="taranim">
            <div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid fa-feather-pointed text-4xl text-white drop-shadow-lg"></i></div>
          </div>
          <div class="p-3 bg-gradient-to-br from-goldDeep to-[#8a6a2a] text-white">
            <h3 class="font-display font-bold text-sm">ترانيم روحية</h3>
            <p class="text-[10px] text-white/70">مجموعة مختارة</p>
          </div>
        </a>
        <a href="#" onclick="goLibrary('extra'); return false;" class="snap-start shrink-0 w-32 rounded-2xl overflow-hidden shadow-xl shadow-ink/10 ring-1 ring-gold/30 hover:-translate-y-1 transition bg-gradient-to-br from-clay to-[#b08b6e] relative overflow-hidden">
          <span class="absolute top-2 right-2 bg-gold text-ink text-[9px] font-extrabold px-1.5 py-0.5 rounded-full">جديد</span>
          <div class="h-40 relative">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover opacity-30 mix-blend-overlay" alt="extra">
            <div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid fa-star-and-crescent text-4xl text-white drop-shadow-lg"></i></div>
          </div>
          <div class="p-3 bg-gradient-to-br from-clay to-[#b08b6e] text-white">
            <h3 class="font-display font-bold text-sm">كتاب إضافي</h3>
            <p class="text-[10px] text-white/70">ترانيم مستقلة</p>
          </div>
        </a>
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-3 gap-3 mt-4">
        <button onclick="goLibrary('main')" class="glass rounded-2xl p-4 text-center hover:shadow-xl transition hover:-translate-y-0.5">
          <i class="fa-solid fa-book-open text-2xl text-ink mb-2"></i>
          <p class="text-xs font-bold text-ink">المكتبة</p>
        </button>
        <button onclick="openReader('h11')" class="glass rounded-2xl p-4 text-center hover:shadow-xl transition hover:-translate-y-0.5">
          <i class="fa-solid fa-headphones text-2xl text-goldDeep mb-2"></i>
          <p class="text-xs font-bold text-ink">استمع</p>
        </button>
        <button onclick="openReader('e1201')" class="glass rounded-2xl p-4 text-center hover:shadow-xl transition hover:-translate-y-0.5 ring-1 ring-gold/20">
          <i class="fa-solid fa-star text-2xl text-goldDeep mb-2"></i>
          <p class="text-xs font-bold text-ink">جديد</p>
        </button>
      </div>
    </div>
  </section>

  <!-- SCREEN: LIBRARY -->
  <section id="screen-library" class="hidden min-h-screen">
    <header class="sticky top-0 z-30 glass-dark px-5 py-4 flex items-center justify-between">
      <button onclick="goHome()" class="text-parchment/90 hover:text-white"><i class="fa-solid fa-arrow-right"></i></button>
      <h2 class="font-display text-xl font-bold text-parchment">المكتبة</h2>
      <button onclick="openSearch()" class="text-parchment/90 hover:text-white"><i class="fa-solid fa-magnifying-glass"></i></button>
    </header>

    <div class="px-5 py-4">
      <div id="library-filters" class="flex gap-2 overflow-x-auto pb-3"></div>
      <div id="library-list" class="space-y-2"></div>
    </div>
  </section>

  <!-- SCREEN: READER -->
  <section id="screen-reader" class="hidden min-h-screen bg-parchment">
    <header class="sticky top-0 z-30 glass px-5 py-4 flex items-center justify-between">
      <button onclick="goLibrary('main')" class="text-ink/70 hover:text-ink"><i class="fa-solid fa-arrow-right"></i></button>
      <h2 id="reader-title" class="font-display text-lg font-bold text-ink truncate max-w-[60%]">عنوان الترنيمة</h2>
      <button onclick="toggleLike(this)" class="text-ink/60 hover:text-red-500 transition"><i class="fa-regular fa-heart text-lg"></i></button>
    </header>

    <main class="px-6 pt-8 pb-24 max-w-xl mx-auto">
      <div class="text-center mb-8">
        <span id="reader-number" class="inline-block text-xs font-extrabold tracking-widest text-goldDeep uppercase mb-2">رقم</span>
        <h1 id="reader-h1" class="font-display text-4xl font-bold text-ink leading-tight">عنوان</h1>
      </div>

      <article id="reader-body" class="space-y-8 text-xl md:text-2xl leading-[1.9] text-ink text-justify"></article>

      <div class="mt-12 pt-6 border-t border-ink/10 flex items-center justify-between">
        <div class="flex gap-3">
          <button onclick="playAudio()" class="w-11 h-11 rounded-full bg-white/70 border border-white/60 text-ink hover:text-goldDeep transition flex items-center justify-center shadow-sm"><i class="fa-solid fa-play"></i></button>
          <button onclick="shareHymn()" class="w-11 h-11 rounded-full bg-white/70 border border-white/60 text-ink hover:text-ink transition flex items-center justify-center shadow-sm"><i class="fa-solid fa-share-nodes"></i></button>
        </div>
        <div class="text-xs text-stone">ترجمة: <span class="font-bold text-ink">عربية فصحى</span></div>
      </div>
    </main>
  </section>

</div>

<script>
// Real data from app
const books = {
  main: { label: 'الكتاب الرئيسي', prefix: 'h', cover: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600&auto=format&fit=crop', hymns: [
    { id: 'h11', number: 11, title: 'لنا في كلام الإله', meter: '87.87.87', verses: ['لَنَا فِي كَلَامِ الْإِلٰهِ الصَّمَد', 'أَسَاسٌ لإِيمَانِنَا كَالْجَبَل'], chorus: false },
    { id: 'h15', number: 15, title: 'في كلمتك يا رب', meter: '88.88', verses: ['فِي كَلِمَتِكَ يَا رَبُّ نُورٌ', 'تُضِيءُ دَرْبِي وَتَقُودُ خُطَايَ'], chorus: false },
    { id: 'h20', number: 20, title: 'أحبك يا رب', meter: '87.87', verses: ['أُحِبُّكَ يَا رَبُّ حُبًّا عَمِيقًا', 'وَأَرْغَبُ أَنْ أَكُونَ مَعَكَ دَائِمًا'], chorus: true },
    { id: 'h27', number: 27, title: 'نعمته عظيمة', meter: '87.87.87', verses: ['نِعْمَتُهُ عَظِيمَةٌ جِدًّا', 'وَفَضْلُهُ لَا يُحْصَى'], chorus: false },
    { id: 'h150', number: 150, title: 'في صليب يسوع', meter: '87.87', verses: ['فِي صَلِيبِ يَسُوعَ خَلَاصِي', 'وَفِي دَمِهِ غُفْرَانِي'], chorus: false },
  ]},
  taranim: { label: 'ترانيم روحية', prefix: 'tr', cover: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=600&auto=format&fit=crop', hymns: [
    { id: 'tr1', number: 1, title: 'لنا في كلام الإله الصمد', meter: '87.87.87', verses: ['لَنَا فِي كَلَامِ الْإِلٰهِ الصَّمَد', 'أَسَاسٌ لإِيمَانِنَا كَالْجَبَل'], chorus: false },
    { id: 'tr4', number: 4, title: 'يا إلهنا العظيم', meter: '88.88', verses: ['يَا إِلَهَنَا الْعَظِيمَ', 'نَسْجُدُ أَمَامَكَ بِشُكْرٍ'], chorus: false },
    { id: 'tr7', number: 7, title: 'روحك القدوس', meter: '76.76.D', verses: ['رُوحُكَ الْقُدُّوسُ مَعِي', 'وَفِي ضِيقِي يَسْنُدُنِي'], chorus: true },
  ]},
  extra: { label: 'كتاب إضافي', prefix: 'e', cover: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=600&auto=format&fit=crop', hymns: [
    { id: 'e1201', number: 1201, title: 'لنا في كلام الإله الصمد', meter: '87.87.87', verses: ['لَنَا فِي كَلَامِ الْإِلٰهِ الصَّمَد', 'أَسَاسٌ لإِيمَانِنَا كَالْجَبَل', 'وَهَلْ مِنْ مَزِيدٍ عَلَى مَا وَعَد'], chorus: true },
    { id: 'e1202', number: 1202, title: 'في حضنك يا رب', meter: '88.88', verses: ['فِي حِضْنِكَ يَا رَبُّ أَمَانٌ', 'وَفِي قَلْبِكَ رَاحَةٌ'], chorus: false },
    { id: 'e1203', number: 1203, title: 'نورك في قلبي', meter: '87.87', verses: ['نُورُكَ فِي قَلْبِي سَاطِعٌ', 'وَفِي طَرِيقِي هَادٍ'], chorus: false },
  ]},
};

let currentBook = 'main';
let currentHymn = null;

function hideAll() { document.querySelectorAll('section[id^="screen-"]').forEach(s => s.classList.add('hidden')); }

function goHome() { hideAll(); document.getElementById('screen-home').classList.remove('hidden'); window.scrollTo(0,0); }
function goLibrary(bookId) {
  currentBook = bookId; hideAll(); document.getElementById('screen-library').classList.remove('hidden');
  renderLibrary(); window.scrollTo(0,0);
}
function openReader(id) {
  currentHymn = id; const h = findHymn(id); if(!h) return goLibrary('main');
  hideAll(); document.getElementById('screen-reader').classList.remove('hidden');
  document.getElementById('reader-h1').textContent = h.title;
  document.getElementById('reader-number').textContent = 'رقم ' + h.number;
  document.getElementById('reader-title').textContent = h.title;
  document.getElementById('reader-body').innerHTML = h.verses.map((v,i) => `<div class="border-r-4 ${i===0?'border-gold/40':'border-sage/40'} pr-5 bg-gradient-to-l from-gold/[0.05] to-transparent rounded-r-xl py-1"><p>${v}</p></div>`).join('');
  window.scrollTo(0,0);
}

function findHymn(id) {
  for (const b in books) for (const h of books[b].hymns) if (h.id === id) return h;
  return null;
}

function renderLibrary() {
  const filters = document.getElementById('library-filters');
  const list = document.getElementById('library-list');
  const b = books[currentBook];
  filters.innerHTML = `<button onclick="filterBook('main')" class="${currentBook==='main'?'bg-ink text-parchment':'bg-white/60 text-stone border'} px-4 py-1.5 rounded-full text-xs font-extrabold shadow">الرئيسي</button>` +
    `<button onclick="filterBook('taranim')" class="${currentBook==='taranim'?'bg-ink text-parchment':'bg-white/60 text-stone border'} px-4 py-1.5 rounded-full text-xs font-extrabold shadow">روحية</button>` +
    `<button onclick="filterBook('extra')" class="${currentBook==='extra'?'bg-ink text-parchment':'bg-white/60 text-stone border'} px-4 py-1.5 rounded-full text-xs font-extrabold shadow">إضافي</button>`;

  list.innerHTML = b.hymns.map(h => `
    <a href="#" onclick="openReader('${h.id}'); return false;" class="glass rounded-[1.75rem] p-5 block shadow hover:shadow-xl hover:-translate-y-0.5 transition">
      <div class="flex items-start gap-4">
        <span class="w-12 h-12 rounded-xl bg-gradient-to-br from-ink to-[#1a3a2e] text-parchment flex items-center justify-center text-sm font-extrabold shadow-md">${h.number}</span>
        <div class="flex-1">
          <h3 class="font-display text-xl font-bold text-ink">${h.title}</h3>
          <p class="text-xs text-stone mt-1">مقياس ${h.meter} · ${b.label}</p>
        </div>
        <i class="fa-solid fa-chevron-left text-stone/40"></i>
      </div>
    </a>`).join('');
}

function filterBook(b) { currentBook = b; renderLibrary(); }
function openSearch() { document.getElementById('library-filters').scrollIntoView({behavior:'smooth'}); }
function toggleLike(btn) { btn.querySelector('i').classList.toggle('fa-regular'); btn.querySelector('i').classList.toggle('fa-solid'); btn.querySelector('i').classList.toggle('text-red-500'); }
function playAudio() { alert('تشغيل التسجيل الصوتي للترنيمة'); }
function shareHymn() { alert('مشاركة الترنيمة'); }
</script>

</body>
</html>
