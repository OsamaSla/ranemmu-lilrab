name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo/Metro cache (project state). Keyed on the lockfile so cache
      # misses happen exactly when dependencies change.
      - uses: actions/cache@v4
        with:
          path: ~/.expo
          key: ${{ runner.os }}-expo-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-expo-

      - run: npm ci --prefer-offline --no-audit

      # Single parameterized web build: quality gates, corpus drift check,
      # static export and the post steps all run here. Deliberately no
      # DEPLOY=1: that is the GitHub Pages base path only (see app.config.js).
      #
      # The EXPO_PUBLIC_FIREBASE_* values are inlined at build time. Without
      # them the deployed app silently runs offline-only: /admin shows
      # "cloud storage not configured" and no editor entry appears.
      - name: Build web app
        run: npm run build:web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

      # The deploy needs a service account with Firebase Hosting Admin.
      # Skip cleanly (with a warning) until it is configured, instead of
      # failing every push to main.
      - name: Check deploy credentials
        id: creds
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANEMMU_LILRAB }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_RANEMMU_LILRAB is not set - skipping Firebase deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.creds.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANEMMU_LILRAB }}
          projectId: ranemmu-lilrab
          channelId: live
