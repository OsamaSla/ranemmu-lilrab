name: Apply overrides inbox
# One-tap publishing from the app: Admin -> Publish drops an override JSON
# into pending-overrides/ on the overrides-inbox branch. This workflow merges
# it into the workbooks (incl. the .xlsx sources, force-added), re-imports,
# validates, rebuilds the corpus, commits everything to main, clears the
# processed inbox files, and redeploys Pages — no PC needed.
#
# Safety: check-hymns gates the commit (a structural mismatch fails the run
# and the inbox file stays for manual handling). Inbox history is kept in git
# as the audit trail.

on:
  push:
    branches: [overrides-inbox]
    paths: ['pending-overrides/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect inbox files
        id: inbox
        run: |
          git fetch origin overrides-inbox
          files=$(git ls-tree -r --name-only origin/overrides-inbox -- pending-overrides/ | grep '\.json$' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          i=0
          for f in $files; do
            i=$((i + 1))
            git show "origin/overrides-inbox:$f" > "/tmp/inbox-$i.json"
          done
          echo "count=$i" >> "$GITHUB_OUTPUT"

      - name: Apply to workbooks
        if: steps.inbox.outputs.count != '0'
        run: |
          for f in /tmp/inbox-*.json; do node scripts/apply-overrides.mjs "$f"; done

      - name: Re-import books
        if: steps.inbox.outputs.count != '0'
        run: |
          node scripts/import-sheet.mjs content/hymns-imported.xlsx
          node scripts/import-sheet.mjs content/taranim-rohiya.xlsx --out content/book-taranim-rohiya.json --book taranim --authors drafts/authors-taranim.json

      - name: Validate and rebuild corpus
        if: steps.inbox.outputs.count != '0'
        run: |
          npm run check:hymns
          npm run build:corpus

      - name: Commit to main
        if: steps.inbox.outputs.count != '0'
        run: |
          git config user.name "overrides-bot"
          git config user.email "overrides-bot@users.noreply.github.com"
          # NOTE: do NOT `git pull --rebase` here — it refuses with exit 128
          # ("cannot pull with rebase: ... uncommitted changes") whenever the
          # tree staged above is dirty, which is exactly when this step runs.
          # Commit first (works detached), then rebase the clean tree, then
          # push the explicit refspec (bare `push origin main` needs a branch).
          git add content/book-hymns-imported.json content/book-taranim-rohiya.json \
            content/authors.json content/drafts/authors-taranim.json \
            assets/hymns src/data/generated-chunks.ts
          git add -f content/hymns-imported.xlsx content/taranim-rohiya.xlsx
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Apply overrides inbox"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main)
          fi

      - name: Clear processed inbox files
        if: steps.inbox.outputs.count != '0'
        # Housekeeping only: re-applying the same inbox is idempotent, so
        # this step must never fail the run — every fallible command below
        # degrades to a warning instead.
        run: |
          git fetch origin overrides-inbox || true
          git checkout -B overrides-inbox origin/overrides-inbox || git checkout -B overrides-inbox
          git config user.name "overrides-bot"
          git config user.email "overrides-bot@users.noreply.github.com"
          for f in ${{ steps.inbox.outputs.files }}; do
            if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git rm -q -- "$f" && echo "cleared: $f" || echo "WARN: could not remove $f"
            else
              echo "already gone: $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing to clear"
          else
            git commit -m "Processed inbox files"
            git push origin overrides-inbox || echo "WARN: inbox push skipped"
          fi

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
      - run: node scripts/pages-fallback.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
