name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # dist/ is generated locally with:
      #   node scripts/create-web.mjs && node scripts/fix-hymn-paths.mjs
      # and committed, so CI publishes exactly what was verified.
      - name: Verify static output exists
        run: |
          test -f dist/library.html
          test -f dist/hymn/tr0001/index.html
          echo "Pages in dist/: $(find dist -name '*.html' | wc -l)"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
